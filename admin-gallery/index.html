<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KETSO Academy moderation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1300px;
      margin: 0 auto;
      background: #ffffff;
      color: #222;
    }

    h1 {
      margin-bottom: 6px;
    }

    .intro {
      margin-bottom: 18px;
      color: #444;
      line-height: 1.5;
      max-width: 800px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 18px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    select,
    button {
      padding: 9px 12px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh {
      background: #333;
      color: white;
    }

    .reset {
      background: #777;
      color: white;
    }

    .approve {
      background: #1f7a3f;
      color: white;
    }

    .reject {
      background: #a11;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      font-weight: bold;
      margin: 14px 0;
      white-space: pre-line;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
      background: #eee;
    }

    .meta {
      font-size: 14px;
      color: #333;
      line-height: 1.45;
    }

    .actions {
      margin-top: 10px;
    }

    .small {
      font-size: 12px;
      color: #666;
      word-break: break-word;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      background: #eee;
      font-size: 12px;
      margin-top: 4px;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<h1>KETSO Academy moderation</h1>

<p class="intro">
  Review student onboarding uploads before they appear in the public KETSO Academy student gallery.
  Approving an upload makes it public and triggers the approval email through Zapier.
</p>

<div class="toolbar">
  <label for="statusFilter"><strong>Status</strong></label>

  <select id="statusFilter">
    <option value="submitted_for_review">Submitted for review</option>
    <option value="pending">Pending</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
    <option value="all">All</option>
  </select>

  <button class="refresh" onclick="loadQueue()">Refresh</button>
  <button class="reset" onclick="resetAdminKey()">Reset admin key</button>
</div>

<div id="status">Loading...</div>

<div id="grid" class="grid"></div>

<script>
const API_BASE = "https://ptb-tree-map.onrender.com";

let adminKey = localStorage.getItem("ketso_admin_key");

if (!adminKey) {
  adminKey = prompt("Enter admin key");
  if (adminKey) {
    localStorage.setItem("ketso_admin_key", adminKey);
  }
}

async function loadQueue() {
  const status = document.getElementById("status");
  const grid = document.getElementById("grid");
  const selectedStatus = document.getElementById("statusFilter").value;

  if (!adminKey) {
    status.textContent = "No admin key entered.";
    return;
  }

  status.textContent = "Loading...";
  grid.innerHTML = "";

  try {
    const res = await fetch(
      `${API_BASE}/api/academy-moderation-queue?status=${encodeURIComponent(selectedStatus)}`,
      {
        headers: {
          "x-admin-key": adminKey
        }
      }
    );

    const data = await res.json();

    console.log("Moderation queue response:", data);

    if (!res.ok || !data.ok) {
      status.textContent = data.error || "Could not load moderation queue.";
      return;
    }

    const uploads = data.uploads || [];

    if (!uploads.length) {
      status.textContent = "No uploads found for this status.";
      return;
    }

    status.textContent = `${uploads.length} upload(s) found.`;

    grid.innerHTML = uploads.map(renderCard).join("");

  } catch (err) {
    console.error("Moderation queue error:", err);
    status.textContent = "Error loading moderation queue.";
  }
}

function renderCard(u) {
  const imageUrl = u.cropped_file_url || "";
  const name = u.uploader_name || "Unknown student";
  const email = u.uploader_email || "";
  const session = displaySession(u.academy_track);
  const cohort = u.academy_cohort || "";
  const status = u.verification_status || "";
  const publicStatus = u.public_gallery_status || "";
  const created = formatDate(u.created_at_utc);
  const confirmed = formatDate(u.student_confirmed_at);
  const reviewed = formatDate(u.reviewed_at_utc);

  return `
    <div class="card" id="upload-${u.id}">
      <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}">

      <div class="meta">
        <strong>ID:</strong> ${u.id}<br>
        <strong>Name:</strong> ${escapeHtml(name)}<br>
        ${email ? `<strong>Email:</strong> ${escapeHtml(email)}<br>` : ""}
        <strong>Session:</strong> ${escapeHtml(session)}<br>
        ${cohort ? `<strong>Cohort:</strong> ${escapeHtml(cohort)}<br>` : ""}

        <span class="badge">${escapeHtml(status)}</span>
        <span class="badge">${escapeHtml(publicStatus)}</span>

        <div class="small">
          Created: ${escapeHtml(created)}<br>
          ${confirmed ? `Submitted: ${escapeHtml(confirmed)}<br>` : ""}
          ${reviewed ? `Reviewed: ${escapeHtml(reviewed)}<br>` : ""}
          ${u.reviewed_by ? `Reviewed by: ${escapeHtml(u.reviewed_by)}<br>` : ""}
        </div>
      </div>

      <div class="actions">
        <button class="approve" onclick="approveUpload(${u.id})">Approve</button>
        <button class="reject" onclick="rejectUpload(${u.id})">Reject</button>
      </div>
    </div>
  `;
}

async function approveUpload(id) {
  if (!confirm("Approve this upload and make it visible in the student gallery?")) {
    return;
  }

  await updateUpload(id, "/api/academy-approve-upload", "Approved");
}

async function rejectUpload(id) {
  if (!confirm("Reject this upload and keep it private?")) {
    return;
  }

  await updateUpload(id, "/api/academy-reject-upload", "Rejected");
}

async function updateUpload(id, endpoint, label) {
  const status = document.getElementById("status");

  try {
    status.textContent = `${label} upload ${id}...`;

    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      },
      body: JSON.stringify({
        review_id: id,
        reviewed_by: "eamonn"
      })
    });

    const data = await res.json();

    console.log(`${label} response:`, data);

    if (!res.ok || !data.ok) {
      status.textContent = data.error || `${label} failed.`;
      return;
    }

    const card = document.getElementById(`upload-${id}`);
    if (card) {
      card.remove();
    }

    status.textContent = `${label}: upload ${id}`;

  } catch (err) {
    console.error(`${label} error:`, err);
    status.textContent = `${label} failed because of a network or server error.`;
  }
}

function resetAdminKey() {
  localStorage.removeItem("ketso_admin_key");
  adminKey = prompt("Enter admin key");
  if (adminKey) {
    localStorage.setItem("ketso_admin_key", adminKey);
    loadQueue();
  }
}

function displaySession(value) {
  if (!value) return "KETSO Academy";
  if (value === "forest_heroes") return "Online tree planting session";
  if (value === "Forest Heroes") return "Online tree planting session";
  return value;
}

function formatDate(value) {
  if (!value) return "";
  try {
    return new Date(value).toLocaleString();
  } catch {
    return value;
  }
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadQueue();
</script>

</body>
</html>
