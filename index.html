<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KETSO crop and upload</title>

  <link rel="stylesheet" href="https://unpkg.com/cropperjs/dist/cropper.min.css">
  <script src="https://unpkg.com/cropperjs/dist/cropper.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    #image {
      max-width: 100%;
      max-height: 600px;
      display: none;
      margin-top: 20px;
    }

    .controls {
      margin-top: 15px;
    }

    button {
      padding: 10px 14px;
      margin: 5px 5px 0 0;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      white-space: pre-line;
      font-weight: bold;
    }

    .note {
      margin-top: 10px;
      color: #444;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<h2>KETSO tree photo upload</h2>

<input type="file" id="fileInput" accept="image/*">

<div class="note">
  1. Use the zoom buttons to zoom in<br>
  2. Drag the image to position it<br>
  3. Adjust the crop box<br>
  4. Click "Crop to 600 px"<br>
  5. Click "Upload"
</div>

<img id="image">

<div class="controls">
  <button id="zoomIn" disabled>Zoom in</button>
  <button id="zoomOut" disabled>Zoom out</button>
</div>

<div class="controls">
  <button id="cropBtn" disabled>Crop to 600 px</button>
  <button id="uploadBtn" disabled>Upload original + cropped</button>
</div>

<p id="status"></p>

<script>
let cropper = null;
let croppedBlob = null;

const fileInput = document.getElementById("fileInput");
const image = document.getElementById("image");
const cropBtn = document.getElementById("cropBtn");
const uploadBtn = document.getElementById("uploadBtn");
const zoomIn = document.getElementById("zoomIn");
const zoomOut = document.getElementById("zoomOut");
const status = document.getElementById("status");

fileInput.addEventListener("change", function (event) {
  const file = event.target.files[0];
  if (!file) return;

  croppedBlob = null;
  uploadBtn.disabled = true;

  const reader = new FileReader();
  reader.onload = function () {
    image.src = reader.result;
    image.style.display = "block";

    if (cropper) {
      cropper.destroy();
    }

    cropper = new Cropper(image, {
      viewMode: 1,
      dragMode: "move",
      autoCropArea: 0.6,
      responsive: true,
      background: false,
      zoomable: true,
      guides: true,
      center: true,
      highlight: true
    });

    cropBtn.disabled = false;
    zoomIn.disabled = false;
    zoomOut.disabled = false;
  };

  reader.readAsDataURL(file);
});

zoomIn.addEventListener("click", () => {
  if (cropper) cropper.zoom(0.2);
});

zoomOut.addEventListener("click", () => {
  if (cropper) cropper.zoom(-0.2);
});

cropBtn.addEventListener("click", function () {
  if (!cropper) return;

  const canvas = cropper.getCroppedCanvas({
    width: 600
  });

  canvas.toBlob(function (blob) {
    croppedBlob = blob;
    uploadBtn.disabled = false;
    status.textContent = "Cropped image ready";
  }, "image/jpeg", 0.82);
});

uploadBtn.addEventListener("click", async function () {
  const originalFile = fileInput.files[0];

  if (!originalFile || !croppedBlob) {
    status.textContent = "Please crop first";
    return;
  }

  try {
    status.textContent = "Uploading original...";

    // upload original
    const fd1 = new FormData();
    fd1.append("file", originalFile);

    const res1 = await fetch("/upload", {
      method: "POST",
      body: fd1
    });

    const data1 = await res1.json();

    if (!res1.ok) {
      status.textContent = "Original upload failed";
      return;
    }

    status.textContent = "Uploading cropped...";

    // upload cropped
    const name =
      originalFile.name.replace(/\.[^/.]+$/, "") + "_600px.jpg";

    const croppedFile = new File(
      [croppedBlob],
      name,
      { type: "image/jpeg" }
    );

    const fd2 = new FormData();
    fd2.append("file", croppedFile);

    const res2 = await fetch("/upload", {
      method: "POST",
      body: fd2
    });

    const data2 = await res2.json();

    if (!res2.ok) {
      status.textContent = "Cropped upload failed";
      return;
    }

    status.textContent =
      "Done\nOriginal: " + data1.key +
      "\nCropped: " + data2.key;

  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
});
</script>

</body>
</html>
