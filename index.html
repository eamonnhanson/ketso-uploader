<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KETSO crop and upload</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="text"],
    select {
      width: 100%;
      max-width: 500px;
      padding: 8px;
      font-size: 14px;
    }

    #image {
      max-width: 100%;
      max-height: 600px;
      display: none;
      margin-top: 20px;
    }

    .controls {
      margin-top: 15px;
    }

    button {
      padding: 10px 14px;
      margin: 5px 5px 0 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
      white-space: pre-line;
      font-weight: bold;
    }

    .note {
      margin-top: 10px;
      color: #444;
      font-size: 14px;
      line-height: 1.5;
    }

    #forestHeroSection {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: none;
      background: #fafafa;
    }

    #searchResults {
      margin-top: 10px;
      max-width: 700px;
    }

    .result-item {
      padding: 10px;
      border: 1px solid #ddd;
      margin-top: 8px;
      cursor: pointer;
      background: white;
      border-radius: 6px;
    }

    .result-item:hover {
      background: #f0f6ff;
    }

    .selected-item {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #2a6df4;
      background: #eef4ff;
      border-radius: 6px;
      max-width: 700px;
    }

    .small {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<h2>KETSO tree photo upload</h2>

<label for="category">Category</label>
<select id="category">
  <option value="">Select category</option>
  <option value="forest_hero">Forest Hero</option>
  <option value="nursery">Nursery</option>
  <option value="training">Training</option>
  <option value="vocational_training">Vocational training</option>
  <option value="charcoal_making">Charcoal making</option>
  <option value="truck">Truck</option>
  <option value="wilde_ganzen">Wilde Ganzen</option>
  <option value="hoorn_foundation">Hoorn Foundation</option>
  <option value="josephina_foundation">Josephina Foundation</option>
  <option value="care_international">Care International</option>
  <option value="woord_en_daad">Woord en Daad</option>
  <option value="plant_een_boom">Plant een Boom</option>
  <option value="other">Other</option>
</select>

<div id="forestHeroSection">
  <label for="forestHeroSearch">Search Forest Hero / tree</label>
  <input
    type="text"
    id="forestHeroSearch"
    placeholder="Type name, tree type, area, or tree code"
  >

  <div class="small">
    Example: Amara, mango, Makombeh, or tree code
  </div>

  <div id="searchResults"></div>
  <div id="selectedHero" class="selected-item" style="display:none;"></div>
</div>

<label for="fileInput">Photo</label>
<input type="file" id="fileInput" accept="image/*">

<div class="note">
  1. Use the zoom buttons to zoom in<br>
  2. Drag the image to position it<br>
  3. Adjust the crop box<br>
  4. Click "Crop to 600 px"<br>
  5. Click "Upload original + cropped"
</div>

<img id="image" alt="Preview">

<div class="controls">
  <button id="zoomIn" disabled>Zoom in</button>
  <button id="zoomOut" disabled>Zoom out</button>
</div>

<div class="controls">
  <button id="cropBtn" disabled>Crop to 600 px</button>
  <button id="uploadBtn" disabled>Upload original + cropped</button>
</div>

<p id="status"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script>
let cropper = null;
let croppedBlob = null;
let selectedLink = null;
let searchTimeout = null;

// IMPORTANT: use your Render backend here
const SEARCH_API_BASE = "https://ptb-tree-map.onrender.com";

const fileInput = document.getElementById("fileInput");
const image = document.getElementById("image");
const cropBtn = document.getElementById("cropBtn");
const uploadBtn = document.getElementById("uploadBtn");
const zoomIn = document.getElementById("zoomIn");
const zoomOut = document.getElementById("zoomOut");
const status = document.getElementById("status");

const category = document.getElementById("category");
const forestHeroSection = document.getElementById("forestHeroSection");
const forestHeroSearch = document.getElementById("forestHeroSearch");
const searchResults = document.getElementById("searchResults");
const selectedHero = document.getElementById("selectedHero");

// -----------------------------
// category logic
// -----------------------------
category.addEventListener("change", () => {
  selectedLink = null;
  selectedHero.style.display = "none";
  selectedHero.innerHTML = "";
  searchResults.innerHTML = "";

  if (category.value === "forest_hero") {
    forestHeroSection.style.display = "block";
  } else {
    forestHeroSection.style.display = "none";
  }
});

// -----------------------------
// forest hero search
// -----------------------------
forestHeroSearch.addEventListener("input", () => {
  const q = forestHeroSearch.value.trim();

  selectedLink = null;
  selectedHero.style.display = "none";
  selectedHero.innerHTML = "";

  if (searchTimeout) {
    clearTimeout(searchTimeout);
  }

  if (q.length < 2) {
    searchResults.innerHTML = "";
    return;
  }

  searchTimeout = setTimeout(() => {
    runForestHeroSearch(q);
  }, 300);
});

async function runForestHeroSearch(q) {
  searchResults.innerHTML = "Searching...";

  try {
    const url = `${SEARCH_API_BASE}/api/forest-hero-search?q=${encodeURIComponent(q)}`;
    const res = await fetch(url);

    if (!res.ok) {
      searchResults.innerHTML = "Search failed.";
      return;
    }

    const results = await res.json();

    if (!Array.isArray(results) || results.length === 0) {
      searchResults.innerHTML = "No matching Forest Heroes found.";
      return;
    }

    searchResults.innerHTML = "";

    results.forEach(item => {
      const div = document.createElement("div");
      div.className = "result-item";
      div.textContent = item.display_label;

      div.addEventListener("click", () => {
        selectedLink = item;
        selectedHero.style.display = "block";
        selectedHero.innerHTML = `
          <strong>Selected Forest Hero</strong><br>
          ${item.display_label}<br>
          <span class="small">user_id: ${item.user_id}, tree_id: ${item.tree_id}</span>
        `;
        searchResults.innerHTML = "";
      });

      searchResults.appendChild(div);
    });

  } catch (err) {
    searchResults.innerHTML = "Search error: " + err.message;
  }
}

// -----------------------------
// image load + cropper
// -----------------------------
fileInput.addEventListener("change", function (event) {
  const file = event.target.files[0];
  if (!file) return;

  croppedBlob = null;
  uploadBtn.disabled = true;
  cropBtn.disabled = true;
  zoomIn.disabled = true;
  zoomOut.disabled = true;
  status.textContent = "";

  const reader = new FileReader();
  reader.onload = function () {
    image.src = reader.result;
    image.style.display = "block";

    try {
      if (cropper) {
        cropper.destroy();
      }

      cropper = new Cropper(image, {
        viewMode: 1,
        dragMode: "move",
        autoCropArea: 0.6,
        responsive: true,
        background: false,
        zoomable: true,
        guides: true,
        center: true,
        highlight: true
      });

      cropBtn.disabled = false;
      zoomIn.disabled = false;
      zoomOut.disabled = false;
      status.textContent = "Image loaded. You can now zoom and crop.";

    } catch (err) {
      status.textContent = "Cropper failed to load: " + err.message;
    }
  };

  reader.readAsDataURL(file);
});

zoomIn.addEventListener("click", () => {
  if (cropper) cropper.zoom(0.2);
});

zoomOut.addEventListener("click", () => {
  if (cropper) cropper.zoom(-0.2);
});

cropBtn.addEventListener("click", function () {
  if (!cropper) return;

  const canvas = cropper.getCroppedCanvas({
    width: 600
  });

  if (!canvas) {
    status.textContent = "Cropping failed.";
    return;
  }

  canvas.toBlob(function (blob) {
    if (!blob) {
      status.textContent = "Could not create cropped image.";
      return;
    }

    croppedBlob = blob;
    uploadBtn.disabled = false;
    status.textContent = "Cropped image ready. You can now upload both versions.";
  }, "image/jpeg", 0.82);
});

// -----------------------------
// upload original + cropped
// -----------------------------
uploadBtn.addEventListener("click", async function () {
  const originalFile = fileInput.files[0];

  if (!originalFile) {
    status.textContent = "No original file selected.";
    return;
  }

  if (!croppedBlob) {
    status.textContent = "Please crop the image first.";
    return;
  }

  if (category.value === "forest_hero" && !selectedLink) {
    status.textContent = "Please select a Forest Hero before uploading.";
    return;
  }

  try {
    status.textContent = "Uploading original image...";

    const fd1 = new FormData();
    fd1.append("file", originalFile);

    const res1 = await fetch("/upload", {
      method: "POST",
      body: fd1
    });

    const contentType1 = res1.headers.get("content-type") || "";
    let data1;

    if (contentType1.includes("application/json")) {
      data1 = await res1.json();
    } else {
      const text = await res1.text();
      throw new Error("Original upload returned non-JSON response: " + text.slice(0, 200));
    }

    if (!res1.ok) {
      status.textContent = "Original upload failed: " + (data1.error || res1.status);
      return;
    }

    status.textContent = "Uploading cropped 600 px version...";

    const croppedName = originalFile.name.replace(/\.[^/.]+$/, "") + "_600px.jpg";
    const croppedFile = new File([croppedBlob], croppedName, { type: "image/jpeg" });

    const fd2 = new FormData();
    fd2.append("file", croppedFile);

    const res2 = await fetch("/upload", {
      method: "POST",
      body: fd2
    });

    const contentType2 = res2.headers.get("content-type") || "";
    let data2;

    if (contentType2.includes("application/json")) {
      data2 = await res2.json();
    } else {
      const text = await res2.text();
      throw new Error("Cropped upload returned non-JSON response: " + text.slice(0, 200));
    }

    if (!res2.ok) {
      status.textContent = "Cropped upload failed: " + (data2.error || res2.status);
      return;
    }

    status.textContent =
      "Done.\n" +
      "Category: " + (category.value || "none") + "\n" +
      (selectedLink ? "Selected link: " + selectedLink.display_label + "\n" : "") +
      "Original uploaded as: " + data1.key + "\n" +
      "Cropped uploaded as: " + data2.key;

  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
});
</script>

</body>
</html>
