<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KETSO Academy student profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 6px;
    }

    .profile-box {
      background: #f1f8f3;
      border-left: 5px solid #1f7a3f;
      padding: 16px;
      margin-bottom: 24px;
    }

    .points {
      font-size: 22px;
      font-weight: bold;
      color: #1f7a3f;
      margin-top: 10px;
    }
.points-explanation {
  border: 1px solid #d8eadc;
  background: #f7fbf8;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 24px;
  max-width: 720px;
}

.points-explanation h2 {
  margin-top: 0;
  margin-bottom: 8px;
}

.points-explanation ul {
  margin-top: 8px;
  padding-left: 20px;
}

.points-explanation li {
  margin-bottom: 5px;
}

.points-cta {
  margin-top: 12px;
  padding: 10px;
  background: #eef7ee;
  border-left: 4px solid #1f7a3f;
  line-height: 1.4;
}
    .upload-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      max-width: 720px;
      background: #fff;
    }

    .question-card {
      border-color: #b9d9c1;
      background: #f7fbf8;
    }

    .question-label {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #dff0e3;
      color: #176634;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-text,
    .answer-text {
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer-text {
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border-left: 4px solid #1f7a3f;
    }

    .upload-card img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    video {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }

    .meta {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }

    .feedback {
      margin-top: 10px;
      padding: 10px;
      background: #f6f6f6;
      border-left: 4px solid #ccc;
      white-space: pre-line;
    }

    a.button {
      display: inline-block;
      background: #1f7a3f;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<a href="/student-gallery/">← Back to student gallery</a>

<div id="app">
  Loading profile...
</div>

<script src="/shared/academy-courses.js"></script>
<script>
const API_BASE = "https://ptb-tree-map.onrender.com";
const PUBLIC_TUTOR_QUESTIONS_URL = `${API_BASE}/api/academy-tutor-questions/public`;

const params = new URLSearchParams(window.location.search);
const studentId = params.get("student_id");
const requestedCourseKey = params.get("course_key");
const courseKey = window.KETSO_ACADEMY_COURSES?.[requestedCourseKey]
  ? requestedCourseKey
  : window.KETSO_DEFAULT_COURSE;

const app = document.getElementById("app");

if (!studentId) {
  app.innerHTML = "Missing student_id.";
} else {
  loadProfile(studentId);
}

async function loadProfile(id) {
  const [profileResult, questions] = await Promise.all([
    loadStudentProfile(id),
    loadPublicTutorQuestions(id)
  ]);

  if (!profileResult && !questions.length) {
    app.innerHTML = "Could not load student profile.";
    return;
  }

  const fallbackStudent = {
    id,
    full_name: questions[0]?.student_name || "Student",
    total_points: 0
  };

  renderProfile(
    profileResult?.student || fallbackStudent,
    profileResult?.uploads || [],
    profileResult?.point_events || [],
    profileResult?.course,
    profileResult?.progress,
    questions
  );
}

async function loadStudentProfile(id) {
  try {
    const res = await fetch(`${API_BASE}/api/student-profile/${encodeURIComponent(id)}?course_key=${encodeURIComponent(courseKey)}`);
    const data = await res.json();
    return res.ok && data.ok ? data : null;
  } catch (err) {
    console.warn("Could not load student profile details:", err);
    return null;
  }
}

async function loadPublicTutorQuestions(id) {
  try {
    const res = await fetch(`${PUBLIC_TUTOR_QUESTIONS_URL}?course_key=${encodeURIComponent(courseKey)}&t=${Date.now()}`, {
      cache: "no-store"
    });
    const data = await res.json();

    if (!res.ok || data.ok === false) {
      return [];
    }

    const questions = Array.isArray(data)
      ? data
      : data.questions || data.tutor_questions || [];

    if (!Array.isArray(questions)) {
      return [];
    }

    return questions.filter(question => String(question.student_id || question.academy_student_id || "") === String(id));
  } catch (err) {
    console.warn("Could not load public tutor questions:", err);
    return [];
  }
}

function renderProfile(student, uploads, pointEvents, course, progress, tutorQuestions) {
  const approved = Number(progress?.approved_lessons || 0);
  const required = Number(progress?.required_lessons || 0);
  app.innerHTML = `
    <div class="profile-box">
      <h1>${escapeHtml(student.full_name || "Student")}</h1>
      <div class="meta">Cohort: ${escapeHtml(student.cohort || "Not set")}</div>
      <div class="meta">Stream / track: ${escapeHtml(student.track || "Not set")}</div>
      <div class="meta">Course: ${escapeHtml(course?.name || "Online tree planting")}</div>
      <div class="points">⭐ ${student.total_points || 0} point(s)</div>
      <div class="meta">Progress: ${approved} of ${required} required lessons approved</div>
      <p>${renderCourseLinks(student.id)}</p>
    </div>

    ${renderPointsExplanation(student, pointEvents)}

    <h2>Approved uploads</h2>
    ${uploads.length ? uploads.map(renderUpload).join("") : "<p>No approved uploads yet.</p>"}

    <h2>Questions and answers</h2>
    ${tutorQuestions.length ? tutorQuestions.map(renderTutorQuestion).join("") : "<p>No public questions and answers yet.</p>"}
  `;
}

function renderCourseLinks(id) {
  return Object.entries(window.KETSO_ACADEMY_COURSES || {})
    .map(([key, definition]) =>
      `<a class="button" href="?student_id=${encodeURIComponent(id)}&course_key=${encodeURIComponent(key)}">${escapeHtml(definition.name)}</a>`
    )
    .join("\n");
}

function renderTutorQuestion(question) {
  const courseName = question.course_name || "Course not listed";
  const answeredAt = formatDate(question.answered_at);

  return `
    <article class="upload-card question-card">
      <div class="question-label">Question and answer</div>
      <div><strong>${escapeHtml(question.student_name || "Student")}</strong></div>
      <div class="meta"><strong>Course:</strong> ${escapeHtml(courseName)}</div>
      ${question.module_name ? `<div class="meta"><strong>Module:</strong> ${escapeHtml(question.module_name)}</div>` : ""}
      <div class="question-text"><strong>Question:</strong><br>${escapeHtml(question.question_text || "Question not available.")}</div>
      <div class="answer-text"><strong>Tutor answer:</strong><br>${escapeHtml(question.answer_text || "Answer not available.")}</div>
      <div class="meta"><strong>Answered:</strong> ${escapeHtml(answeredAt || "Date not available")}</div>
    </article>
  `;
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
}
function renderPointsExplanation(student, pointEvents) {
  const events = Array.isArray(pointEvents) ? pointEvents : [];
  const total = Number(student.total_points || 0);

  const rows = events
    .filter(event => Number(event.points || 0) !== 0)
    .map(event => `
      <li>
        <strong>+${Number(event.points || 0)}</strong>
        ${escapeHtml(labelPointEvent(event))}
      </li>
    `)
    .join("");

  return `
    <div class="points-explanation">
      <h2>How these points were earned</h2>
      ${
        rows
          ? `<p>This student has earned <strong>${total} point(s)</strong> through approved academy activity:</p><ul>${rows}</ul>`
          : `<p>This student has not earned public points yet.</p>`
      }

      <div class="points-cta">
        <strong>Want to earn more points?</strong><br>
        Upload a clear photo, video, document, or lesson answer through your KETSO Academy upload link.
        Approved public uploads can earn points. Students who complete onboarding receive an extra onboarding badge and bonus point.
      </div>
    </div>
  `;
}

function labelPointEvent(event) {
  const key = String(event.event_key || "");

  if (key === "onboarding_approved_bonus") {
    return "Onboarding completed bonus";
  }

  if (key === "onboarding_first_upload") {
    return "First onboarding upload";
  }

  if (key.startsWith("approved_upload_")) {
    return "Approved public upload";
  }

  return event.event_label || key || "Academy activity";
}
function renderUpload(upload) {
  const lesson = labelLesson(upload.lesson_key);
  const uploadType = upload.upload_type || upload.file_type || "upload";
  const fileUrl = upload.cropped_file_url || upload.original_file_url;

  let mediaHtml = "";

  if (upload.file_type === "image" || upload.upload_type === "image_photo") {
    mediaHtml = `<img src="${escapeAttr(fileUrl)}" alt="Student upload">`;
  } else if (upload.file_type === "video" || upload.upload_type === "video") {
    mediaHtml = `<video controls src="${escapeAttr(fileUrl)}"></video>`;
  } else {
    mediaHtml = `<a class="button" href="${escapeAttr(fileUrl)}" target="_blank">Open upload</a>`;
  }

  return `
    <div class="upload-card">
      <strong>${escapeHtml(lesson)}</strong>
      <div class="meta">Upload type: ${escapeHtml(uploadType)}</div>
      <div class="meta">Points: +${upload.points_awarded || 0}</div>
      ${mediaHtml}
      ${
        upload.ai_feedback || upload.ai_description
          ? `<div class="feedback"><strong>AI feedback</strong><br>${escapeHtml(upload.ai_feedback || upload.ai_description)}</div>`
          : ""
      }
    </div>
  `;
}

function labelLesson(value) {
  const configuredLesson = window.KETSO_ACADEMY_COURSES?.[courseKey]?.lessons
    ?.find(([key]) => key === value);
  if (configuredLesson) return configuredLesson[1];

  const map = {
    onboarding: "Onboarding",
    lesson_1_climate_change: "Lesson 1 Climate Change",
    lesson_2_tree_health: "Lesson 2 Tree Health",
    lesson_3_tree_planting: "Lesson 3 Tree Planting",
    lesson_4_co2_increase: "Lesson 4 We cause Carbon Dioxide Increase",
    arb1_module_1_tree_biology: "Module 1: Introduction to Arboriculture",
    arb1_module_2_tree_identification: "Module 2: Observing trees",
    arb1_basic_chemistry_plant_growth: "Module 3: Basic chemistry for plant growth",
    arb1_tree_physiology: "Module 4: Tree Physiology",
    arb1_module_3_soil_and_roots: "Module 5: Soil and roots",
    arb1_module_4_tree_selection: "Module 6: Choosing the right tree",
    arb1_module_5_tree_planting: "Module 7: Tree planting",
    arb1_module_6_tree_care: "Module 8: Young tree care",
    arb1_module_7_tree_health: "Module 9: Tree health assessment",
    arb1_module_8_pruning: "Module 10: Basic pruning",
    evaluation: "Evaluation"
  };

  return map[value] || value || "Lesson";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value);
}
</script>

</body>
</html>
