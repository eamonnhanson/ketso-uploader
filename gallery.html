<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KETSO gallery</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

.controls {
  margin-bottom: 20px;
}

.item {
  display: inline-block;
  width: 220px;
  margin: 10px;
  vertical-align: top;
}

img {
  width: 200px;
  height: auto;
}

.small {
  font-size: 12px;
  color: #555;
}
</style>
</head>

<body>

<h2>KETSO gallery</h2>

<div class="controls">
  <select id="filterCategory">
    <option value="all">All</option>
    <option value="plant_een_boom">Plant een Boom</option>
    <option value="forest_hero">Forest Hero</option>
    <option value="other">Other</option>
  </select>
<select id="filterYear">
  <option value="">All years</option>
  <option value="2026">2026</option>
  <option value="2025">2025</option>
</select>

<select id="filterMonth">
  <option value="">All months</option>
  <option value="01">January</option>
  <option value="02">February</option>
  <option value="03">March</option>
  <option value="04">April</option>
  <option value="05">May</option>
  <option value="06">June</option>
  <option value="07">July</option>
  <option value="08">August</option>
  <option value="09">September</option>
  <option value="10">October</option>
  <option value="11">November</option>
  <option value="12">December</option>
</select>
  <input type="text" id="searchBox" placeholder="Search...">

  <button onclick="loadGallery()">Filter</button>
</div>

<div id="gallery">Loading...</div>

<script>
const API = "https://ptb-tree-map.onrender.com/api/photo-review-gallery";

async function loadGallery() {
  const container = document.getElementById("gallery");

const category = document.getElementById("filterCategory").value;
const year = document.getElementById("filterYear").value;
const month = document.getElementById("filterMonth").value;
const search = document.getElementById("searchBox").value;

const params = new URLSearchParams();
params.set("verification_status", "approved");
params.set("public_gallery_status", "public");

if (category !== "all") {
  params.set("category", category);
}

if (year && month) {
  const lastDay = new Date(Number(year), Number(month), 0).getDate();
  params.set("date_from", `${year}-${month}-01`);
  params.set("date_to", `${year}-${month}-${String(lastDay).padStart(2, "0")}`);
} else if (year) {
  params.set("date_from", `${year}-01-01`);
  params.set("date_to", `${year}-12-31`);
}

if (search.trim()) {
  params.set("search", search.trim());
}

const url = `${API}?${params.toString()}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (!data.ok) {
      container.textContent = "Error loading data";
      return;
    }

    renderGallery((data.photos || []).filter(isGeneralGalleryPhoto));

  } catch (err) {
    container.textContent = "Failed: " + err.message;
  }
}

function isGeneralGalleryPhoto(photo) {
  const category = photo.category || "";

  if (photo.academy_student_id) return false;
  if (photo.linked_entity_type === "staff") return false;
  if (category === "academy_onboarding" || category === "academy_upload") return false;
  if (category.startsWith("student_")) return false;
  if (category === "staff_upload") return false;

  return true;
}

function renderGallery(photos) {
  const container = document.getElementById("gallery");
  container.innerHTML = "";

  if (!photos.length) {
    container.textContent = "No images found.";
    return;
  }

  photos.forEach(p => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <img src="${p.cropped_file_url}">
      <div><strong>${p.category}</strong></div>
      <div class="small">${p.linked_entity_name || "-"}</div>
      <div class="small">Original: ${p.original_kb || "-"} KB</div>
      <div class="small">Cropped: ${p.cropped_kb || "-"} KB</div>
      <div class="small"><em>${(p.ai_description || "").slice(0,120)}</em></div>
      <div class="small">${p.created_at_utc}</div>
    `;

    container.appendChild(div);
  });
}

// initial load
loadGallery();
</script>

</body>
</html>
