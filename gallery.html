<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KETSO uploads</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .item { margin-bottom: 20px; }
    img { max-width: 180px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>

<h2>KETSO uploaded images</h2>
<div id="gallery">Loading...</div>

<script>
async function loadImages() {
  const container = document.getElementById("gallery");

  try {
    const res = await fetch("/list");

    if (!res.ok) {
      container.textContent = "Error loading images";
      return;
    }

    const files = await res.json();
    container.innerHTML = "";

    if (!files.length) {
      container.textContent = "No images uploaded yet.";
      return;
    }

    files.forEach(file => {
      const div = document.createElement("div");
      div.className = "item";

      const img = document.createElement("img");
      img.src = "https://pub-146513161ecf43ebbf81dda0cf702fde.r2.dev/" + encodeURIComponent(file.key);

      const name = document.createElement("p");
      name.textContent = file.key;

      div.appendChild(img);
      div.appendChild(name);
      container.appendChild(div);
    });

  } catch (err) {
    container.textContent = "Failed to load images: " + err.message;
  }
}

loadImages();
</script>

</body>
</html>
