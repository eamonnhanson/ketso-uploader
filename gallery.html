<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KETSO uploads</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .item { margin-bottom: 20px; }
    img { max-width: 180px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>KETSO uploaded images</h2>
  <div id="gallery">Loading...</div>

<script>
async function loadImages() {
  const res = await fetch("/list");
  const files = await res.json();

  const container = document.getElementById("gallery");
  container.innerHTML = "";

  if (!files.length) {
    container.textContent = "No images uploaded yet.";
    return;
  }

  files.forEach(file => {
    const div = document.createElement("div");
    div.className = "item";

    const img = document.createElement("img");
    img.src = "https://pub-REPLACE_THIS_WITH_YOUR_R2_PUBLIC_URL.r2.dev/" + encodeURIComponent(file.key);

    const name = document.createElement("p");
    name.textContent = file.key;

    div.appendChild(img);
    div.appendChild(name);
    container.appendChild(div);
  });
}

loadImages();
</script>
</body>
</html>
